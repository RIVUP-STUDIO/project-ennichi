<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f3d58e">
  <title>Project 縁日｜型抜き Ver.4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">PROJECT ENNICHI</p>
      <h1>型抜き</h1>
      <p class="tagline">あの気持ちを、もう一度。</p>
    </header>

    <section class="panel">
      <div class="top">
        <div>
          <span>STAGE</span>
          <strong id="stageName">1 / 3　日の丸</strong>
        </div>
        <button id="soundBtn" class="round">🔊</button>
      </div>

      <div class="progress"><div id="progressBar"></div></div>

      <div class="canvasWrap">
        <canvas id="game" width="640" height="720"></canvas>
        <div id="guide" class="guide">
          <strong>針をつかんで黄色い点へ</strong>
          <span>内側に入ると即アウト。外側は戻ればセーフ。</span>
        </div>
      </div>

      <div class="stats">
        <div><span>進行</span><strong id="progressText">0%</strong></div>
        <div><span>タイム</span><strong id="timer">0.0s</strong></div>
        <div><span>状態</span><strong id="stateText">READY</strong></div>
      </div>

      <div class="legend">
        <span><i class="g"></i>線上</span>
        <span><i class="w"></i>外側</span>
        <span><i class="r"></i>内側＝即アウト</span>
      </div>

      <div class="actions">
        <button id="resetBtn" class="secondary">やり直す</button>
        <button id="nextBtn" class="primary" disabled>次のステージ</button>
      </div>
    </section>

    <footer>Prototype v4.0</footer>
  </main>

  <dialog id="resultDialog">
    <div class="result">
      <div id="resultIcon">✨</div>
      <p id="resultKicker">CLEAR!</p>
      <h2 id="resultTitle">抜けた！</h2>
      <p id="resultBody"></p>
      <button id="resultNext" class="primary">次へ</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
