<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#11131d">
  <title>KING OF KATANUKI｜Project 縁日 Ver.5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="glow glow1"></div><div class="glow glow2"></div>
  <div id="hud" class="hidden">
    <div id="needleName"></div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="timer">0.0s</div>
  </div>
  <canvas id="game"></canvas>
  <div class="legend hidden" id="legend">
    <span><i class="dot safe"></i>溝の上</span>
    <span><i class="dot outside"></i>外側</span>
    <span><i class="dot danger"></i>内側＝即アウト</span>
  </div>
  <div class="overlay" id="titleScreen">
    <div class="stageLabel">PROJECT ENNICHI</div>
    <h1 class="title">KING<br>OF<br>KATANUKI<span class="sub">あの気持ちを、もう一度。</span></h1>
    <div class="stageList" id="stageList"></div>
  </div>
  <div class="overlay hidden" id="gameoverScreen">
    <div class="stageLabel dangerText">割れた…</div>
    <h1 class="title small">GAME OVER</h1>
    <button class="cta" id="retryBtn">もう一度</button>
    <button class="linkBtn" id="backBtnOver">ステージ選択へ</button>
  </div>
  <div class="overlay hidden" id="clearScreen">
    <div class="stageLabel clearText">CLEAR</div>
    <h1 class="title small" id="clearTitle">ポロッ！</h1>
    <div class="resultTime">クリアタイム <b id="clearTime">0.00s</b></div>
    <button class="cta" id="nextBtn">つぎのステージへ</button>
    <button class="linkBtn" id="backBtnClear">ステージ選択へ</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
